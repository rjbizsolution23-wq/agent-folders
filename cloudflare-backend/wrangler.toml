name = "agent-folders-email-engine"
main = "src/index.ts"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]

# D1 Serverless SQLite Database Binding
[[d1_databases]]
binding = "DB"
database_name = "agent_folders_db"
database_id = "b8da4ed9-be89-404c-b449-9ab39a7d45a7"

# Cron Trigger: Evaluates due drip emails every hour
[triggers]
crons = ["0 * * * *"]

[vars]
APP_URL = "https://agent-folders.rjbusinesssolutions.org"

[observability]
enabled = true

[assets]
directory = "../landing-page"
binding = "ASSETS"

name: UANDA Architecture Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Architecture Validation
        run: python3 scripts/validate-architecture.py

      - name: Check Instruction Drift
        run: python3 scripts/check-instruction-drift.py

      - name: Run Unit Tests
        run: python3 -m unittest discover tests/unit
